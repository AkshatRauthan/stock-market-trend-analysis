name: Sync and Keep Alive
on:
  push:
    branches: [main]

jobs:
  # Job 1: Sync code to Hugging Face Deployment
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://DevAkshat:$HF_TOKEN@huggingface.co/spaces/DevAkshat/MarketPulse_Stock-Market-Trend-Analysis main